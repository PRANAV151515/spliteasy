spring.application.name=spliteasy
server.port=${PORT:8080}

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:spliteasydb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Hibernate tables khud bana dega
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings (deploy pe JWT_SECRET environment variable se aayega)
jwt.secret=${JWT_SECRET:c3BsaXRlYXN5LXN1cGVyLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTEyMzQ1Njc4OTA=}
jwt.expiration-ms=86400000

# Frontend ka URL (CORS ke liye), deploy pe FRONTEND_URL se aayega
app.frontend-url=${FRONTEND_URL:http://localhost:5173}


